version: '3.9'

services:
  app-test:
    image: pixelvault_test:latest
    build: 
      context: ..
      dockerfile: ./docker/Dockerfile.dev
    container_name: pixelvault_test
    environment:
      - SECRET_KEY=8254aa6280e2b43715d249df50fcf23d0475f84bdad4172aafe0f233c5e4e2fd
      - HTTPS=false
      - UPLOAD_FOLDER=/app/uploads
      - DATA_DIRECTORY=/app/instance
      - DATABASE_URL=sqlite:////app/instance/pixelvault.db
      - MAX_UPLOAD_MB=500
      - FLASK_DEBUG=true
      - PORT=5050
      - FLASK_TEMPLATES_FOLDER=/app/templates
      - FLASK_STATIC_FOLDER=/app/static
      - ADMIN_EMAIL=admin@test.com
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
    volumes:
      - ${PIXELVAULT_ROOT:?set the root}/src/pixelvault:/app/pixelvault
      - ${PIXELVAULT_ROOT:?set the root}/templates:/app/templates
      - ${PIXELVAULT_ROOT:?set the root}/static:/app/static
      - ${PIXELVAULT_ROOT:?set the root}/app.py:/app/app.py
      - ${DATA_DIRECTORY:?set the data directory}:/app/instance
      - ${UPLOAD_FOLDER:?set the upload directory}:/app/uploads
    ports:
      - 5050:5050
