{# HTML part of the password-change notice — the garnish, never the payload.

   Built to the same constraints as invite.html: tables for layout because Outlook
   renders through Word, every style inline because Gmail strips <style> blocks, no
   images or web fonts because remote assets are blocked by default in most clients.
   Strip every attribute below and what remains is the same sentences in the same
   order as password_changed.txt.

   Unlike the invite there is no button, and that is deliberate rather than an
   omission: this message has nothing to click, so a copy of it that grows a link
   later should have to justify itself.

   Autoescaped (Jinja escapes .html). Palette in step with templates/base.html:
   #0d0d0f page, #141417 card, #2a2a30 border, #e8e6e0 text, #888680 dim,
   #d4a853 amber. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0d0d0f" style="background-color:#0d0d0f;margin:0;padding:0;width:100%;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" bgcolor="#141417" style="background-color:#141417;border:1px solid #2a2a30;border-radius:6px;max-width:560px;width:100%;">
        <tr>
          <td style="padding:36px 36px 8px 36px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;color:#e8e6e0;">
            PixelVault<span style="color:#d4a853;">.</span>
          </td>
        </tr>
        <tr>
          <td style="padding:0 36px 24px 36px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.4;color:#888680;border-bottom:1px solid #2a2a30;">
            Your password was changed
          </td>
        </tr>

        <tr>
          <td style="padding:28px 36px 0 36px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#e8e6e0;">
            <p style="margin:0 0 16px 0;">Hello {{ username }},</p>
            <p style="margin:0 0 16px 0;">
              The password for your PixelVault account
              (<strong style="color:#e8e6e0;">{{ email }}</strong>) was changed on
              <strong style="color:#e8e6e0;">{{ changed_at_text }}</strong>.
            </p>
            <p style="margin:0 0 16px 0;">
              Every other device that was signed in to this account has been signed out.
              You will need to sign in again on each of them with the new password.
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 36px 28px 36px;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;color:#e8e6e0;border-top:1px solid #2a2a30;">
            <p style="margin:0 0 12px 0;">If you made this change, there is nothing to do.</p>
            <p style="margin:0;">
              If you did not,
              {% if contact %}contact
                <a href="mailto:{{ contact }}" style="color:#d4a853;text-decoration:none;">{{ contact }}</a>
              {% else %}contact the administrator of {{ site_name }}{% endif %}
              straight away &mdash; someone else may have had access to your account.
              Note that this message will never ask you to follow a link to fix it.
            </p>
          </td>
        </tr>
      </table>

      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
        <tr>
          <td align="center" style="padding:16px 12px 0 12px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#555450;">
            PixelVault &mdash; invite-only photo albums
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
