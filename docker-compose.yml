version: '3.9'

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - HTTPS=${HTTPS:-false}
      - UPLOAD_FOLDER=/app/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
      - FLASK_DEBUG=false
    volumes:
      - uploads:/app/uploads
      - db:/app/instance
    expose:
      - "5000"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro           # Put your SSL certs here
      - uploads:/app/uploads:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  uploads:
  db:

networks:
  internal:
