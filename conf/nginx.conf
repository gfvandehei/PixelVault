# ── PixelVault Nginx Config ────────────────────────────────────────────────────
#
# CONTAINER-ONLY — NOT APPLIED BY DEFAULT.
#
# This file is mounted into the `nginx` service in docker/prod.docker-compose.yml,
# which is gated behind `profiles: [nginx]` and therefore does not start unless
# explicitly requested. It assumes nginx runs inside the compose network
# (`proxy_pass http://app:5000`, certs at /etc/nginx/certs).
#
# The real deployment terminates TLS on a separate VPS reverse proxy and the app
# container publishes 5000:5000 directly, so none of the values tuned below reach
# production. A standalone server block for that topology is tracked in
# https://github.com/gfvandehei/PixelVault/issues/28 — edit this file only if you
# actually run `--profile nginx`.
#
# See docs/upload_operations.md for which hop enforces which limit.

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ── SSL ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload size limit (match MAX_UPLOAD_MB × number of files per batch) ──
    client_max_body_size 2G;
    client_body_timeout 300s;

    # ── Proxy to Flask ──
    location / {
        proxy_pass         http://app:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Block direct access to upload storage ──
    location /uploads/ {
        deny all;
    }
}
